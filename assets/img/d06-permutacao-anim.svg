<title id="t6perm">Animação do teste de permutação. À esquerda, uma grade de 25 unidades com os valores agrupados num canto, cujo índice de Moran é 0,74; em seguida a mesma grade com os valores sorteados ao acaso quatro vezes, com índices de menos 0,17, menos 0,28, menos 0,04 e 0,00. À direita, o histograma de 400 sorteios, concentrado em torno de zero e com máximo em 0,34, e uma linha vermelha marcando o valor observado de 0,74, muito à direita de toda a distribuição.</title>
